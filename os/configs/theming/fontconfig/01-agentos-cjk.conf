<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- AgentOS CJK 字体回退策略。

     思路参考 github.com/LanRhyme/dotfiles 的 fontconfig 配置（无许可证，
     本文件为重写的精简版）：只对指定的西文字体 prepend 中文字体做回退，
     不全局篡改字体匹配——避免"所有西文字体都变成中文字体"的副作用。

     部署到 ~/.config/fontconfig/conf.d/ -->
<fontconfig>
  <!-- 常见 UI/网页西文字体 → 补 Noto Sans CJK SC 回退（中文不掉豆腐块） -->
  <match target="pattern">
    <test name="family" compare="eq"><string>Helvetica Neue</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Arial</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Segoe UI</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>

  <!-- 常见西文等宽字体 → 补 Noto Sans Mono CJK SC（终端场景中文对齐） -->
  <match target="pattern">
    <test name="family" compare="eq"><string>Menlo</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Mono CJK SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Consolas</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Mono CJK SC</string>
    </edit>
  </match>
</fontconfig>
