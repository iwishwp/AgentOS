; AgentOS GTK3 主题设置
; 值选择（光标/图标/字体）参考 github.com/LanRhyme/dotfiles 的取向，内容自写。
; 依赖包：bibata-cursor-theme（或 AUR bibata-cursor-theme-bin）、tela-circle-icon-theme、
; google-noto-sans-cjk-fonts / google-noto-sans-mono-cjk-fonts
; 部署到 ~/.config/gtk-3.0/settings.ini

[Settings]
gtk-application-prefer-dark-theme=true
gtk-enable-animations=true
gtk-cursor-theme-name=Bibata-Modern-Classic
gtk-cursor-theme-size=16
gtk-icon-theme-name=Tela-circle-dark
gtk-font-name=Noto Sans CJK SC, 10
